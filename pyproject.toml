[project]
name = "apartment-agent"
version = "0.1.0"
description = "Apartment monitoring and analytics agent for Astana"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.41,<3.0",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "alembic>=1.16,<2.0",
  "httpx>=0.28,<1.0",
  "python-telegram-bot>=22.2,<23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.16,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
